name: Testy

on:
  push:
    branches: [main]
    paths-ignore: ["plan.json", "README.md"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy jednostkowe
        run: node --test tests/*.test.mjs
