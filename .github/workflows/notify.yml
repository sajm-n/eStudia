name: Powiadomienia o zadaniach

# Inteligentne powiadomienia Web Push:
# - Uruchamia się co godzinę oraz natychmiast po zmianie plan.json.
# - Jeśli w najbliższych 75 minutach nie ma zadań do powiadomienia, kończy się po ~5 sekundach.
# - Stan wysyłki i subskrypcje urządzeń trzyma na osobnej gałęzi push-state (gałąź main pozostaje czysta).
# Wymaga sekretu VAPID_PRIVATE_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "37 * * * *"
    - cron: "43 4,5 * * *"
  push:
    branches: [main]
    paths: ["plan.json"]
  workflow_dispatch:
    inputs:
      test:
        description: "Wyślij testowe powiadomienie na wszystkie zapisane urządzenia (bez pętli)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: powiadomienia
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      TZ: Europe/Warsaw
      BRANCH: ${{ github.ref_name }}
      STATE_BRANCH: push-state
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Powiadomienia
        env:
          TEST: ${{ inputs.test }}
        run: |
          if [ "${TEST:-false}" = "true" ]; then
            STATE_DIR="/tmp/estudia-push-state"
            rm -rf "$STATE_DIR"
            git clone --depth=1 --branch "$STATE_BRANCH" "$(git remote get-url origin)" "$STATE_DIR" 2>/dev/null || mkdir -p "$STATE_DIR"
            STATE_DIR="$STATE_DIR" node scripts/notify.mjs || true
          else
            bash scripts/loop.sh
          fi
