<body>
<div class="scroller" id="scroller">
<main id="main">
<div class="top">
  <h1 id="ttl">Plan zajęć</h1>
  <div class="tools">
    <button class="tbtn" id="ed" type="button" data-a="edit:" aria-pressed="false">Edytuj</button>
    <button class="tbtn ic" type="button" data-a="set:" aria-label="Ustawienia">&#9881;&#xFE0E;</button>
  </div>
</div>
<div class="subrow">
  <p class="sub" id="sub" data-a="mcal:sub"></p>
  <button class="chip" id="chip" type="button" data-a="chip:"><i></i><span id="chipT"></span></button>
</div>
<div id="devBar" class="devbar" hidden>
  <span><b>Tryb deweloperski</b> · odizolowany playground (bez zapisu na GitHub)</span>
  <div class="devbar-acts">
    <button type="button" data-a="devload:">Wczytaj plik</button>
    <button type="button" class="pri" data-a="devexit:">Wróć do normalnego planu</button>
  </div>
</div>
<input type="file" id="devImpf" accept=".json,application/json" hidden>
<div id="alerts" hidden></div>
<section class="view" id="v-plan" aria-label="Plan zajęć">
  <div id="ahead" class="ahead" hidden></div>
  <div class="cal" id="cal"></div>
  <div class="row">
    <button class="today" id="td" type="button" data-a="today:">Dzisiaj</button>
  </div>
  <div id="list"></div>
  <div class="leg"><span><i style="background:var(--wyk)"></i>Wykład</span><span><i style="background:var(--lab)"></i>Laboratorium</span><span><i style="background:var(--cw)"></i>Ćwiczenia</span><span><i style="background:var(--proj)"></i>Projekt</span></div>
  <p class="sub" id="note" style="text-transform:none;margin-top:14px"></p>
</section>
<section class="view" id="v-tasks" aria-label="Zadania" hidden>
  <button type="button" class="nthint" id="ntHint" data-a="nt:" hidden>Włącz powiadomienia o niewykonanych zadaniach</button>
  <div class="tkbar"><button type="button" class="tkadd" id="olBtn" data-a="ol:" aria-expanded="false" aria-controls="tkOnlineForm"><b aria-hidden="true">+</b>Dodaj zadanie</button><button type="button" class="tkex" id="exBtn" data-a="exams:">Sesja / Kolokwia</button><button type="button" class="sw" id="hdBtn" data-a="hd:" role="switch" aria-checked="false"><i></i>Ukryj ukończone</button></div>
  <div id="tkOlWrap" class="olwrap" hidden><div id="tkOnlineForm" class="olcard"></div></div>
  <div class="tkfilt" id="tkFilt">
    <input type="search" id="tkSearch" placeholder="Szukaj zadania lub przedmiotu…" aria-label="Szukaj zadań" autocomplete="off">
    <select id="tkSubj" aria-label="Filtruj po przedmiocie"></select>
    <select id="tkCat" aria-label="Filtruj po typie zadania"></select>
  </div>
  <div id="tkLists"></div>
</section>
<section class="view" id="v-subj" aria-label="Przedmioty" hidden>
  <h2 class="hh"><span>Wszystkie przedmioty</span><em id="sbN">0</em></h2>
  <div id="sbList" class="free"></div>
</section>
</main>
</div>
<nav class="bnav" id="bnav" aria-label="Główne zakładki">
  <i class="ind" aria-hidden="true"></i>
  <button type="button" data-a="tab:plan" id="nv-plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Plan zajęć</span></button>
  <button type="button" data-a="tab:tasks" id="nv-tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l3 3 5-6"/></svg><span>Zadania</span></button>
  <button type="button" data-a="tab:subj" id="nv-subj"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v12H8.5A3.5 3.5 0 0 1 5 16.5z"/><path d="M5 16.5A3.5 3.5 0 0 1 8.5 13H19"/></svg><span>Przedmioty</span></button>
  <div class="bfoot">
    <button class="tbtn ic" type="button" data-a="set:" aria-label="Ustawienia" title="Ustawienia">&#9881;&#xFE0E;</button>
    <button class="chip" id="chipD" type="button" data-a="chip:"><i></i><span id="chipDT"></span></button>
  </div>
</nav>
<div class="mini" id="mini" role="dialog" aria-label="Kalendarz miesiąca" hidden></div>
<button class="fab" id="fab" type="button" data-a="add:" aria-label="Dodaj zajęcia" hidden>+</button>
<div class="shbg" id="shbg" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" tabindex="-1">
    <div class="grip"></div>
    <h2 id="shT"></h2>
    <div id="shBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
